services:
  api:
    build: .
    container_name: task-manager-api
    ports:
      - "5000:5000"
    volumes:
      - ./data:app/data
      - ./app:/app/app
    environment:
      DATABASE_URL: sqlite:///app/data/taskmanagerapi.db
    command: flask --app wsgi run --host 0.0.0.0 --port 5000 --debug